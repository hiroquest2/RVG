# fly.toml app configuration file generated for argvxxxxx on 2026-11-13T18:28:26Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'my-rvg-app'
primary_region = 'lhr'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  [mounts]
  source = "rvg_data_lhr"
  destination = "/data"
